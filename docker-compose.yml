services:
  obsidian:
    build: .
    restart: unless-stopped
    # Keep stdin open with a terminal so console commands work via `docker attach`.
    stdin_open: true
    tty: true
    environment:
      FEEDBACK_WEBHOOK_URL: "${FEEDBACK_WEBHOOK_URL:-}"
    ports:
      - "25565:25565"
    volumes:
      - obsidian-files:/files
    networks:
      - bridge

volumes:
    obsidian-files:

networks:
  bridge:
    driver: bridge
    external: false
