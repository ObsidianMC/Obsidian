name: Nuget

on:
  workflow_dispatch:
  push:
    branches: ["1.21.x"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
    # only publish when we change a file here
    paths:
      - "Obsidian.API/**/*.cs"
      - "Obsidian.API/*.csproj"
      - "Obsidian.API.Client/**/*.cs"
      - "Obsidian.API.Client/**/*.razor"
      - "Obsidian.API.Client/*.csproj"
      - "Obsidian/Obsidian.csproj"
      - "Obsidian.AssetGenerator/**"
      - "Obsidian.SourceGenerators/**/*.cs"
      - "Obsidian.SourceGenerators/*.csproj"
      - ".github/workflows/nuget-push.yml"

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

jobs:
  nuget-publish:
    name: Package Commit
    runs-on: ubuntu-latest
    # Trusted publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so there's no key to
    # store or rotate. It needs a nuget.org trusted publishing policy for this repository and workflow file.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10
            9
            8
            7
      - name: Setup Java
        # Generating the vanilla assets runs the Minecraft server's data generators.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Pack
        # Nightlies are 1.1.0-nightly.<run>: a dot-separated number sorts numerically, so mods can float on
        # 1.1.0-nightly.*. The older 1.0.0-nightly-<run> versions compare as text, which puts nightly-100 below
        # nightly-99. The client API depends on the API package of the same version.
        env:
          VERSION: 1.1.0-nightly.${{ github.run_number }}
        run: |
          dotnet pack Obsidian.API/Obsidian.API.csproj -c Release -o build -p:Version=$VERSION
          dotnet pack Obsidian.API.Client/Obsidian.API.Client.csproj -c Release -o build -p:Version=$VERSION
      # After packing, which can take a while: the key it gives lasts an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        # Through the environment rather than expanded into the script, which the shell would parse.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "build/*.nupkg" --skip-duplicate -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json
