name: Nuget

# Nightlies publish once a day, not on every merge, and only when the packages changed since the branch's last
# nightly and the branch's latest build passed and built the packages' code as it is. A manual run or a tag skips the
# change check, not the build check. GitHub runs scheduled workflows from the default branch (26.3.x) copy of this file.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    tags: ["v*.*.*"]

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  BRANCH: 26.3.x

jobs:
  gate:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # The asset generator's vanilla capture tooling, which only the tests use. Every *Fixtures.java probe
          # writes a test fixture, except JoinFixtures.java, which also writes synced_registries.json into the API.
          CAPTURE_ONLY: >-
            ^Obsidian\.AssetGenerator/(Captures/|Scenario[^/]*\.cs$|WorldgenCaptures\.cs$|WorldgenFixtureFiles\.cs$|Java/BlockUseInstrumentation\.java$|Java/[^/]*-(input|cases|samples)\.json$|Java/[^/]*Fixtures\.java$)
        run: |
          skip() { echo "Not publishing: $1"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }
          publish() { echo "Publishing: $1"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; }

          # The packages' code: the API projects, the source generators, the bundled NBT library, shared build
          # settings, the Minecraft version and the asset generator, which generates the vanilla data they embed.
          code=(
            Obsidian.API Obsidian.API.Client Obsidian.SourceGenerators Obsidian.Nbt
            Obsidian/Obsidian.csproj Directory.Build.props Obsidian.AssetGenerator
          )
          # Files the packages carry as they are.
          packed=(README.md LICENSE icon.png)

          # The package files that changed between two commits, without the capture tooling.
          changed() {
            git diff --name-only "$1" "$2" -- "${@:3}" \
              | awk '$0 ~ /\/JoinFixtures\.java$/ || $0 !~ ENVIRON["CAPTURE_ONLY"]'
          }

          # The branch's latest build (cancelled runs aside) must have finished, passed, and built the packages' code
          # as it is now. A failing or unfinished build, or code changed since, holds the publish for a later run.
          # Every query runs in an assignment, which fails the job if the query fails, so a failed query never
          # publishes.
          build=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dotnet.yml --branch "$BRANCH" --event push \
            --limit 20 --json status,conclusion,headSha \
            --jq '[.[] | select(.conclusion != "cancelled")][0] | "\(.status)|\(.conclusion)|\(.headSha)"')
          IFS='|' read -r status conclusion built <<< "$build"
          echo "Latest build of $BRANCH: $status $conclusion at $built"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            skip "the latest build of $BRANCH hasn't passed"
          fi
          if ! git cat-file -e "$built^{commit}" 2>/dev/null; then
            skip "the latest build's commit $built isn't in this history"
          fi
          # Only what dotnet.yml builds counts here, so a docs-only commit after a green build doesn't hold it.
          unbuilt=$(changed "$built" HEAD "${code[@]}" \
            | awk '/\.(cs|csproj|java)$/ || $0 == "Directory.Build.props" || $0 == "Obsidian.Nbt"')
          if [ -n "$unbuilt" ]; then
            skip "the packages' code changed after the latest passing build: $(echo $unbuilt)"
          fi

          if [ "$EVENT" != "schedule" ]; then
            publish "a $EVENT run doesn't wait for package changes"
          fi

          # The commit of this branch's last run whose publish job ran. Runs the gate held back, the run in progress
          # and other branches' publishes don't count.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nuget-push.yml --branch "$BRANCH" \
            --status success --limit 1000 --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"')
          last=""
          for run in $runs; do
            published=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" \
              --jq '[.jobs[] | select(.name == "Package Commit" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              last=${run#*:}
              break
            fi
          done

          # A full page of 1,000 runs without a publish can't tell "never published" from "published longer ago",
          # so it waits for a manual run rather than guessing.
          if [ -z "$last" ] && [ "$(printf '%s\n' $runs | grep -c .)" -ge 1000 ]; then
            skip "no nightly in the last 1,000 runs of $BRANCH; publish with a manual run"
          fi
          if [ -z "$last" ]; then
            publish "no earlier nightly of $BRANCH found"
          fi
          if ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            publish "the last nightly's commit $last isn't in this history"
          fi

          updated=$(changed "$last" HEAD "${code[@]}" "${packed[@]}")
          if [ -z "$updated" ]; then
            skip "nothing in the packages changed since the last nightly at $last"
          fi
          publish "changed since the last nightly at $last: $(echo $updated)"

  nuget-publish:
    name: Package Commit
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so there's no key to
    # store or rotate. It needs a nuget.org trusted publishing policy for this repository and workflow file.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            11
            10
            9
            8
            7
      - name: Setup Java
        # Generating the vanilla assets runs the Minecraft server's data generators.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Pack
        # Nightlies are <Minecraft version>-nightly.<run>: a dot-separated number sorts numerically, so mods can
        # float on 26.3.0-nightly.*, and mods floating on another version's line (the 1.21.x branch published
        # 1.1.0-nightly.*) don't pick up an API built for a different protocol. The older 1.0.0-nightly-<run>
        # versions compare as text, which puts nightly-100 below nightly-99. The client API depends on the API
        # package of the same version.
        # The projects set GeneratePackageOnBuild, under which pack skips building the project itself; turning it
        # off makes pack build first, and stops Obsidian.Nbt, bundled in the API package, packing on its own.
        env:
          VERSION: 26.3.0-nightly.${{ github.run_number }}
        run: |
          dotnet pack Obsidian.API/Obsidian.API.csproj -c Release -o build -p:Version=$VERSION \
            -p:GeneratePackageOnBuild=false
          dotnet pack Obsidian.API.Client/Obsidian.API.Client.csproj -c Release -o build -p:Version=$VERSION \
            -p:GeneratePackageOnBuild=false
      # After packing, which can take a while: the key it gives lasts an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        # Through the environment rather than expanded into the script, which the shell would parse.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "build/*.nupkg" --skip-duplicate -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json
