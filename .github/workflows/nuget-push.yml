name: Nuget

# Nightlies publish once a day, not on every merge, and only when something the packages are built from changed
# since the last nightly and the branch's latest build passed. A manual run skips the change check; a tag publishes
# a release. GitHub runs scheduled workflows from the default branch (26.3.x) copy of this file.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    tags: ["v*.*.*"]

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  BRANCH: 26.3.x

jobs:
  gate:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip() { echo "Not publishing: $1"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The branch's latest build (cancelled runs aside) must have finished and passed. A failing or unfinished
          # one holds the nightly until a later run.
          build=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dotnet.yml --branch "$BRANCH" --event push \
            --limit 20 --json status,conclusion,headSha \
            --jq '[.[] | select(.conclusion != "cancelled")][0] | "\(.status) \(.conclusion) \(.headSha)"')
          read -r status conclusion sha <<< "$build"
          echo "Latest build of $BRANCH: $status $conclusion at $sha"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            skip "the latest build of $BRANCH hasn't passed"
          fi

          if [ "$EVENT" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit of the last run whose publish job ran; runs the gate held back don't count.
          last=""
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nuget-push.yml --limit 60 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            published=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" \
              --jq '[.jobs[] | select(.name == "Package Commit" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              last=${run#*:}
              break
            fi
          done

          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No earlier nightly found in this history; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What the packages are built from: the API projects, the source generators, the bundled NBT library, the
          # Minecraft version and the asset generator, without its vanilla capture tooling, which only the tests use.
          inputs=(
            Obsidian.API Obsidian.API.Client Obsidian.SourceGenerators Obsidian.Nbt
            Obsidian/Obsidian.csproj Directory.Build.props Obsidian.AssetGenerator .github/workflows/nuget-push.yml
            ':(exclude)Obsidian.AssetGenerator/Captures'
            ':(exclude)Obsidian.AssetGenerator/FixtureDumper.cs'
            ':(exclude)Obsidian.AssetGenerator/Scenario*.cs'
            ':(exclude)Obsidian.AssetGenerator/WorldgenCaptures.cs'
            ':(exclude)Obsidian.AssetGenerator/WorldgenFixtureFiles.cs'
            ':(exclude)Obsidian.AssetGenerator/Java/*Fixtures.java'
            ':(exclude)Obsidian.AssetGenerator/Java/BlockUseInstrumentation.java'
            ':(exclude)Obsidian.AssetGenerator/Java/*-input.json'
            ':(exclude)Obsidian.AssetGenerator/Java/*-samples.json'
            ':(exclude)Obsidian.AssetGenerator/Java/*-cases.json'
          )
          if git diff --quiet "$last" HEAD -- "${inputs[@]}"; then
            skip "nothing the packages are built from changed since $last"
          fi

          git diff --stat "$last" HEAD -- "${inputs[@]}" | tail -1
          echo "publish=true" >> "$GITHUB_OUTPUT"

  nuget-publish:
    name: Package Commit
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so there's no key to
    # store or rotate. It needs a nuget.org trusted publishing policy for this repository and workflow file.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            11
            10
            9
            8
            7
      - name: Setup Java
        # Generating the vanilla assets runs the Minecraft server's data generators.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Pack
        # Nightlies are <Minecraft version>-nightly.<run>: a dot-separated number sorts numerically, so mods can
        # float on 26.3.0-nightly.*, and mods floating on another version's line (the 1.21.x branch published
        # 1.1.0-nightly.*) don't pick up an API built for a different protocol. The older 1.0.0-nightly-<run>
        # versions compare as text, which puts nightly-100 below nightly-99. The client API depends on the API
        # package of the same version.
        # The projects set GeneratePackageOnBuild, under which pack skips building the project itself; turning it
        # off makes pack build first, and stops Obsidian.Nbt, bundled in the API package, packing on its own.
        env:
          VERSION: 26.3.0-nightly.${{ github.run_number }}
        run: |
          dotnet pack Obsidian.API/Obsidian.API.csproj -c Release -o build -p:Version=$VERSION \
            -p:GeneratePackageOnBuild=false
          dotnet pack Obsidian.API.Client/Obsidian.API.Client.csproj -c Release -o build -p:Version=$VERSION \
            -p:GeneratePackageOnBuild=false
      # After packing, which can take a while: the key it gives lasts an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        # Through the environment rather than expanded into the script, which the shell would parse.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "build/*.nupkg" --skip-duplicate -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json
