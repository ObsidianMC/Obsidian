name: Worldgen parity

# Chunk generation tests are slow, so the main workflow skips them (see TestCategory.Worldgen). This one runs them
# whenever worldgen code or its captures change; worldgen-captures.yml checks the captures themselves. GitHub only
# runs scheduled workflows from the default branch's copy of this file.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches: [ "26.*" ]
    paths:
      - "Obsidian/WorldData/Generators/**"
      - "Obsidian/WorldData/Features/**"
      - "Obsidian/WorldData/Structures/**"
      - "Obsidian.AssetGenerator/Captures/**"
      - "Obsidian.AssetGenerator/WorldgenCaptures.cs"
      - "Obsidian.AssetGenerator/WorldgenFixtureFiles.cs"
      - "Obsidian.AssetGenerator/Datagen/WorldgenAssets.cs"
      - "Obsidian.Tests/Assets/vanilla_worldgen*"
      - "Obsidian.Tests/Assets/vanilla_worldgen*/**"
      - "Obsidian.Tests/Vanilla*.cs"
      - "Obsidian.Tests/Worldgen*.cs"
      - ".github/workflows/worldgen.yml"
  pull_request:
    branches: [ "26.*" ]
    paths:
      - "Obsidian/WorldData/Generators/**"
      - "Obsidian/WorldData/Features/**"
      - "Obsidian/WorldData/Structures/**"
      - "Obsidian.AssetGenerator/Captures/**"
      - "Obsidian.AssetGenerator/WorldgenCaptures.cs"
      - "Obsidian.AssetGenerator/WorldgenFixtureFiles.cs"
      - "Obsidian.AssetGenerator/Datagen/WorldgenAssets.cs"
      - "Obsidian.Tests/Assets/vanilla_worldgen*"
      - "Obsidian.Tests/Assets/vanilla_worldgen*/**"
      - "Obsidian.Tests/Vanilla*.cs"
      - "Obsidian.Tests/Worldgen*.cs"
      - ".github/workflows/worldgen.yml"

jobs:
  tests:
    name: Worldgen tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Setup Java
      # Generating the vanilla assets runs the Minecraft server's data generators.
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - name: Read the Minecraft versions
      id: versions
      run: |
        project=Obsidian/Obsidian.csproj
        echo "current=$(sed -nE 's|.*<MinecraftVersion>([^<]+)<.*|\1|p' "$project")" >> "$GITHUB_OUTPUT"
        echo "legacy=$(sed -nE 's|.*<LegacyMinecraftVersion>([^<]+)<.*|\1|p' "$project")" >> "$GITHUB_OUTPUT"
    - name: Cache the vanilla downloads
      # The server jars, Mojang's generated data (the asset generator's cache) and the structure templates the tests
      # extract only change with the versions, so later runs skip downloading them and running the data generators.
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/obsidian
          /tmp/obsidian-tests/cache
        key: vanilla-v1-${{ runner.os }}-${{ steps.versions.outputs.current }}-${{ steps.versions.outputs.legacy }}
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: dotnet test --no-build --configuration Release --filter "Category=Worldgen"
