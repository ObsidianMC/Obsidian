name: Worldgen captures

# Records the vanilla worldgen captures again and checks that they match the committed files. Vanilla is pinned, so
# this can only find something when the capture probe, its driver or the committed captures change: a probe edited
# without re-recording, a hand-edited capture, or a probe that records differently from run to run. Worldgen code
# changes don't need it; their parity tests run in worldgen.yml.
on:
  workflow_dispatch:
  push:
    branches: [ "26.*" ]
    paths:
      - "Obsidian.AssetGenerator/Captures/**"
      - "Obsidian.AssetGenerator/WorldgenCaptures.cs"
      - "Obsidian.AssetGenerator/WorldgenFixtureFiles.cs"
      - "Obsidian.AssetGenerator/VanillaServer.cs"
      - "Obsidian.AssetGenerator/Obsidian.AssetGenerator.csproj"
      - "Obsidian.Tests/Assets/vanilla_worldgen*"
      - "Obsidian.Tests/Assets/vanilla_worldgen*/**"
      - ".github/workflows/worldgen-captures.yml"
  pull_request:
    branches: [ "26.*" ]
    paths:
      - "Obsidian.AssetGenerator/Captures/**"
      - "Obsidian.AssetGenerator/WorldgenCaptures.cs"
      - "Obsidian.AssetGenerator/WorldgenFixtureFiles.cs"
      - "Obsidian.AssetGenerator/VanillaServer.cs"
      - "Obsidian.AssetGenerator/Obsidian.AssetGenerator.csproj"
      - "Obsidian.Tests/Assets/vanilla_worldgen*"
      - "Obsidian.Tests/Assets/vanilla_worldgen*/**"
      - ".github/workflows/worldgen-captures.yml"

jobs:
  captures:
    name: Captures reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - name: Keep the committed captures
      run: cp -r Obsidian.Tests/Assets "$RUNNER_TEMP/committed-assets"
    - name: Record the captures again
      run: dotnet build Obsidian.AssetGenerator --configuration Release -t:CaptureVanillaWorldgen
    - name: Compare with the committed captures
      # Compared as parsed JSON, so formatting differences alone don't fail the check.
      run: |
        python3 - "$RUNNER_TEMP/committed-assets" Obsidian.Tests/Assets <<'EOF'
        import json
        import pathlib
        import sys

        committed_root = pathlib.Path(sys.argv[1])
        recorded_root = pathlib.Path(sys.argv[2])


        def capture_files(root):
            files = {}
            for path in root.rglob("*.json"):
                relative = path.relative_to(root)
                if relative.parts[0].startswith("vanilla_worldgen"):
                    files[relative] = path
            return files


        committed = capture_files(committed_root)
        recorded = capture_files(recorded_root)
        failures = []

        for relative in sorted(committed.keys() | recorded.keys()):
            if relative not in recorded:
                failures.append(f"{relative}: committed but no longer recorded")
                continue

            if relative not in committed:
                failures.append(f"{relative}: recorded but not committed")
                continue

            committed_data = json.loads(committed[relative].read_text(encoding="utf-8"))
            recorded_data = json.loads(recorded[relative].read_text(encoding="utf-8"))
            if committed_data != recorded_data:
                failures.append(f"{relative}: recorded data differs from the committed file")

        for failure in failures:
            print(failure)

        if failures:
            sys.exit(1)

        print(f"{len(committed)} capture files match what the probe records.")
        EOF
